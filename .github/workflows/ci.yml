name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      # --all-targets excludes doctests, so run them explicitly. Currently a
      # no-op (no doctests exist) but keeps future doctests from being skipped.
      - run: cargo test --doc

  # Aggregate the per-OS test matrix into one stable check named exactly
  # "Test". The matrix jobs above emit "Test (ubuntu-latest)" and
  # "Test (macos-latest)", so this gate is what satisfies the branch
  # ruleset's required "Test" context. `needs.test.result` is "success" only
  # when every matrix leg passed (fail-fast is off, so all legs run); the
  # `if: always()` keeps this job from being skipped when a leg fails, so a
  # macOS-only failure still reports "Test" as failed and blocks the merge.
  test-result:
    name: Test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Test matrix legs to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix did not succeed (result: ${{ needs.test.result }})"
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: dgossgen-${{ matrix.os }}
          path: target/release/dgossgen
